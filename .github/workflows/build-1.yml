name: Start build

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-slim
    outputs:
      matrix_json: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          LIST: ${{ secrets.list }}
        run: |
          echo -n '[' > matrix.json
          echo "$LIST" | while read -r l; do
            FUID=$(echo "$l" | cut -d'|' -f1)
            FTOKEN=$(echo "$l" | cut -d'|' -f2)
            echo -n "{\"uuid\":\"$FUID\",\"token\":\"$FTOKEN\"}," >> matrix.json
          done
          sed -i '$ s/,$//' matrix.json
          echo -n ']' >> matrix.json
          echo "matrix=$(< matrix.json)" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        include: ${{fromJSON(needs.prepare.outputs.matrix_json)}}
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io wget gnupg2
          sudo systemctl start docker

      - name: Install runner
        run: |
          sudo wget -O /usr/local/bin/forgejo-runner https://code.forgejo.org/forgejo/runner/releases/download/v13.0.0/forgejo-runner-13.0.0-linux-amd64
          sudo chmod +x /usr/local/bin/forgejo-runner

      - name: Checkout Source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Test config
        env:
          URL: ${{ secrets.url }}
          FUID: ${{ matrix.uuid }}
          FTOKEN: ${{ matrix.token }}
        run: |
          sudo env FORGEJO_URL=$URL FORGEJO_RUNNER_UUID=$FUID FORGEJO_RUNNER_TOKEN=$FTOKEN ./setup.sh
          sudo forgejo-runner --config /etc/forgejo-runner/config.yaml daemon & PID=$!
          sleep 4h && sudo kill $PID